name: release-please
# On every push to main, release-please keeps a release PR open that bumps the
# version and updates CHANGELOG.md from the Conventional Commits since the last
# release. Merging that PR creates the vX.Y.Z tag and a draft GitHub release;
# release.yml then adds the binaries, publishes it and pushes the image.
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # A token from the release-please GitHub App: a tag created with
      # GITHUB_TOKEN would not trigger release.yml, and its PRs would not run CI.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
